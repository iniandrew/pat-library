name: Sync Payload Data And Build

# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "23 3 * * *"
#   push:
#     branches:
#       - main

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync upstream data
        run: npm run sync:data

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create PR for updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): refresh PayloadsAllTheThings snapshot"
          branch: "chore/sync-payload-data"
          delete-branch: true
          title: "chore(data): refresh payload snapshot"
          body: |
            Automated update of `data/generated/categories.json` from `swisskyrepo/PayloadsAllTheThings`.
            
            This PR is generated by `.github/workflows/sync-and-build.yml`.
          add-paths: |
            data/generated/categories.json
            scripts/sync-data.mjs
